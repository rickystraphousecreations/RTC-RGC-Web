<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTC RGC</title>

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#game{
    width:100%;
    height:100%;
}

#rtcBoot{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:999999;
    opacity:1;
    transition:opacity .5s ease;
}

#rtcBoot img{
    width:100%;
    height:100%;
    object-fit:cover;
    animation:rtcPulse 2.2s ease-in-out infinite;
}

@keyframes rtcPulse{

0%{
transform:scale(1);
opacity:1;
}

50%{
transform:scale(1.015);
opacity:.95;
}

100%{
transform:scale(1);
opacity:1;
}

}

</style>

</head>

<body>

<div id="rtcBoot">
    <img src="images/rtc_boot_screen.png">
</div>

<div id="game"></div>

<script src="loader.js"></script>

</body>
</html>
